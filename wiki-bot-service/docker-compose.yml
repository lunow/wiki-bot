# One compose project per wiki. Example:
#   ENV_FILE=envs/home.env HOST_PORT=8001 docker compose -p wiki-home up -d --build
services:
  wiki-bot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
